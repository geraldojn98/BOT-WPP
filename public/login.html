<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>ML Bot — Entrar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #FFE600;
      --bg: #f0f2f5;
      --card: #fff;
      --text: #222;
      --muted: #777;
      --green: #00a650;
      --red: #e74c3c;
      --border: #e0e0e0;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 32px 28px; width: 100%; max-width: 380px;
    }
    .logo { font-size: 2.2rem; text-align: center; margin-bottom: 4px; }
    h1 { font-size: 1.15rem; text-align: center; margin-bottom: 24px; color: var(--text); }
    .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 22px; }
    .tab {
      flex: 1; text-align: center; padding: 10px 0; font-size: 0.9rem; font-weight: 700;
      color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
    }
    .tab.active { color: var(--text); border-bottom-color: var(--primary); }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #444; }
    input {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 0.95rem; outline: none; background: #fafafa; color: var(--text);
    }
    input:focus { border-color: #aaa; background: #fff; }
    button[type=submit] {
      width: 100%; padding: 13px; background: var(--primary); color: #000; border: none;
      border-radius: 8px; font-size: 0.95rem; font-weight: 800; cursor: pointer; margin-top: 6px;
    }
    button[type=submit]:disabled { opacity: 0.6; cursor: not-allowed; }
    button[type=submit]:hover:not(:disabled) { opacity: 0.9; }
    .msg { font-size: 0.85rem; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .msg.err { background: #fdecea; color: var(--red); display: block; }
    .msg.ok { background: #e8f8ef; color: var(--green); display: block; }
    .hint { font-size: 0.78rem; color: var(--muted); margin-top: 14px; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🤖</div>
    <h1>ML WhatsApp Bot — Painel</h1>

    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">Entrar</div>
      <div class="tab" id="tab-signup" onclick="switchTab('signup')">Criar conta</div>
    </div>

    <div id="msg" class="msg"></div>

    <form id="form" onsubmit="submitForm(event)">
      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" autocomplete="username" required minlength="3" />
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" autocomplete="current-password" required minlength="6" />
      </div>
      <button type="submit" id="btn-submit">Entrar</button>
    </form>

    <div class="hint" id="signup-hint" style="display:none;">
      Ao criar uma conta, você poderá conectar seu próprio número de WhatsApp e configurar suas automações — tudo separado dos outros usuários.
    </div>
  </div>

  <script>
    let mode = 'login';

    function switchTab(next) {
      mode = next;
      document.getElementById('tab-login').classList.toggle('active', next === 'login');
      document.getElementById('tab-signup').classList.toggle('active', next === 'signup');
      document.getElementById('btn-submit').textContent = next === 'login' ? 'Entrar' : 'Criar conta';
      document.getElementById('password').autocomplete = next === 'login' ? 'current-password' : 'new-password';
      document.getElementById('signup-hint').style.display = next === 'signup' ? 'block' : 'none';
      document.getElementById('msg').style.display = 'none';
    }

    async function submitForm(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const msg = document.getElementById('msg');
      msg.style.display = 'none';
      btn.disabled = true;
      btn.textContent = mode === 'login' ? 'Entrando...' : 'Criando conta...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`/api/auth/${mode}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro inesperado.');
        window.location.href = '/';
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = '❌ ' + err.message;
        msg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = mode === 'login' ? 'Entrar' : 'Criar conta';
      }
    }
  </script>
</body>
</html>
